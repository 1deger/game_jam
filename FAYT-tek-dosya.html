#pausewrap{z-index:120}.bag-empty-note{color:#ffd482;font-size:15px}
#cityroot .missions:has(.turn-order){width:270px;max-height:350px;overflow:auto;scrollbar-width:thin}
.turn-order{background:#101e2af5;border:1px solid #597b80;border-radius:12px;padding:12px;color:#edf5f8;box-shadow:0 12px 35px #0005}
.order-kicker{font-size:10px;letter-spacing:.12em;color:#a9efce}.turn-order h3{font-size:18px;margin:4px 0 7px}.order-clock{display:flex;align-items:center;gap:9px;border-bottom:1px solid #ffffff20;padding-bottom:6px}.order-clock b{font-size:23px;color:#ffd482}.order-clock span{font-size:10px;color:#bfced7}.turn-order ol{list-style:none;padding:0;margin:6px 0}.turn-order li+li{border-top:1px solid #ffffff15}.turn-order button{width:100%;display:flex;align-items:center;gap:7px;padding:7px 2px;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer}.turn-order button em{font-style:normal;min-width:20px;color:#a8edcb}.turn-order button span{flex:1}.turn-order button strong{display:block;font-size:13px}.turn-order button small{display:block;font-size:10px;line-height:1.2;margin-top:2px;color:#b7cbd9}.turn-order button>i{font-size:10px;white-space:nowrap;font-style:normal;color:#ffd482}.turn-order .active{background:#8af0c516;border-radius:5px}.turn-order .active button{border-left:2px solid #a8edcb}.turn-order .waiting{opacity:.55}.turn-order .done{opacity:.65}.order-hint{font-size:11px;color:#a8edcb;line-height:1.3;margin:5px 0}.order-summary{font-size:10px;color:#bdcbd6;line-height:1.4}.order-result{border:1px solid #80c8ac66;background:#132c32;padding:14px 18px;border-radius:8px;margin-bottom:18px}.order-result p{font-size:17px;margin:8px 0}.order-result small{color:#b5d1d2}
#cityroot #links .order-link{stroke:#b4ffdc;stroke-width:.5;stroke-dasharray:1 1;filter:drop-shadow(0 0 3px #7affc7);animation:order-flow 2s linear infinite}

.turn-order button:disabled{opacity:1;cursor:default}.turn-order .done{opacity:.9}.turn-order .waiting{opacity:.65}.turn-order button{padding:5px 2px}.order-rule{font-size:10px;color:#ffda9c;padding:5px 0 2px;line-height:1.25}

/* ---- Yedek su depolama (hz:su) ---- */
.wt-tank{width:820px;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}
.wt-need{grid-column:1/-1;font-size:16px;color:#d6dcf5;letter-spacing:.04em}.wt-need b{color:var(--yel,#ffd23f);font-family:var(--fd)}
.wt-bar{height:22px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden}
.wt-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a7fba,#5bc0ff);transition:width .25s}
#wtT{font-family:var(--fd);font-size:24px;color:#9fd8ff;min-width:130px;text-align:right}
.wt{display:grid;grid-template-columns:repeat(4,196px);gap:12px}
.wt-t{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;min-height:104px;justify-content:center;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.07);font-family:var(--fb);color:inherit}
.wt-t .ti{font-size:34px;color:#9fd8ff}.wt-t .ti .ic{width:34px;height:34px}.wt-t b{font-size:15px;font-weight:600;text-align:center}.wt-t small{font-size:13px;color:var(--mut)}
.wt-t:hover:not(.fx):not(.no){background:rgba(255,255,255,.14)}
.wt-t.fx{border-color:var(--grn);background:rgba(94,224,138,.16)}.wt-t.fx small{color:var(--grn);font-weight:700}
.wt-t.dirty .ti{color:#ffb23e}.wt-t.no{border-color:#ff6b6b;background:rgba(239,71,111,.18);opacity:.8}.wt-t.no small{color:#ffb3b3}

/* ---- Acil risk varyantları: bilgi sorusu ve doğru sıra ---- */
.qz{gap:16px}.qz-prog,.or-prog{display:flex;gap:8px}
.qz-prog i,.or-prog i{width:46px;height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
.qz-prog i.cur,.or-prog i.cur{background:var(--yel,#ffd23f)}.qz-prog i.ok,.or-prog i.ok{background:var(--grn)}.qz-prog i.no{background:#ff6b6b}
.qz .tg-q{max-width:900px;line-height:1.25;font-size:28px}
.qz-opts{flex-direction:column;align-items:stretch;width:760px}
.qz-o{flex-direction:row;width:auto;padding:16px 20px;font-size:18px;text-align:left;justify-content:flex-start;color:inherit;font-family:var(--fb)}
.qz-o.ok{border-color:var(--grn);background:rgba(94,224,138,.2)}.qz-o.no{border-color:#ff6b6b;background:rgba(239,71,111,.2)}
.or .tg-q{margin:0}.or-list{display:flex;flex-direction:column;gap:10px;width:640px}
.or-b{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.07);color:inherit;font-family:var(--fb);font-size:18px;text-align:left}
.or-b em{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-family:var(--fd);font-size:20px;flex:none}
.or-b:hover:not(:disabled){background:rgba(255,255,255,.15)}.or-b.ok{border-color:var(--grn);background:rgba(94,224,138,.18)}.or-b.ok em{background:var(--grn);color:#052}

/* Şehir → ev geçişi: Konutlar mahallesine yakınlaşma */
#cityroot.zooming .hud,#cityroot.zooming .missions,#cityroot.zooming .family-note,#cityroot.zooming .map-legend,#cityroot.zooming .crisis-bar,#cityroot.zooming .plan-bar,#cityroot.zooming .city-status,#cityroot.zooming .ctoast,#cityroot.zooming .turn-order{opacity:0!important;pointer-events:none;transition:opacity .5s}
#cityroot.zooming #mapSlot,#cityroot.zooming #links,#cityroot.zooming #layer{transition:transform 2.5s cubic-bezier(.55,.05,.35,1),filter 2.5s;pointer-events:none}
#cityroot.zoom-go #mapSlot,#cityroot.zoom-go #links,#cityroot.zoom-go #layer{transform:var(--zt,scale(3.4));filter:saturate(.8) brightness(.85)}
#cityroot .zoom-cap{position:absolute;left:0;right:0;bottom:0;z-index:30;text-align:center;padding:60px 8% 6%;background:linear-gradient(transparent,rgba(0,0,0,.85) 55%);opacity:0;pointer-events:none;text-shadow:0 2px 12px #000;transition:opacity .9s .9s}
#cityroot.zoom-go .zoom-cap{opacity:1}
#cityroot .zoom-cap small{display:block;letter-spacing:.2em;color:#ffc24b;font-weight:700}
#cityroot .zoom-cap h1{margin:4px 0;font-size:34px}
#cityroot .zoom-cap p{max-width:720px;margin:0 auto;font-size:16px}
#cityroot::after{content:"";position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .55s}
#cityroot.zoom-fade::after{opacity:1}
@media (prefers-reduced-motion:reduce){#cityroot.zooming #mapSlot,#cityroot.zooming #links,#cityroot.zooming #layer{transition:none}}

/* ===== GRİ TEMA ===== */
#cv2{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#alarmfx{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:50;background:radial-gradient(ellipse at 50% 50%,rgba(120,0,0,0) 38%,rgba(190,20,20,.38) 78%,rgba(215,25,25,.62) 100%);transition:opacity .12s linear}
/* şehirde toz/buğu (öncü sarsıntı ve ana deprem) */
#cityroot .dust-fx{position:absolute;inset:0;z-index:35;pointer-events:none;opacity:0;transition:opacity .8s;
 background:radial-gradient(60% 45% at 20% 70%,rgba(180,181,185,.55),transparent 70%),radial-gradient(55% 40% at 75% 60%,rgba(170,171,175,.5),transparent 70%),radial-gradient(70% 50% at 50% 100%,rgba(165,166,170,.6),transparent 75%),linear-gradient(rgba(130,131,135,.1),rgba(130,131,135,.1))}
#cityroot .dust-fx::before,#cityroot .dust-fx::after{content:"";position:absolute;inset:-10%;background:radial-gradient(40% 30% at 30% 40%,rgba(190,191,195,.45),transparent 70%),radial-gradient(45% 35% at 70% 30%,rgba(185,186,190,.4),transparent 70%);animation:dustdrift 6s ease-in-out infinite alternate}
#cityroot .dust-fx::after{animation-duration:9s;animation-direction:alternate-reverse;opacity:.8}
#cityroot .dust-fx.on{opacity:1}
@keyframes dustdrift{from{transform:translate(-4%,2%) scale(1)}to{transform:translate(5%,-3%) scale(1.12)}}

/* yapı güvenliği mini oyunu */
.bd-opts{display:grid;gap:10px;margin-top:10px}
.bd-o{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid #3a4658;background:#18202b;color:#eef2f5;cursor:pointer;flex-wrap:wrap}
.bd-o b{flex:1;min-width:180px;font-size:15px}
.bd-o small{display:none;flex-basis:100%;margin-left:44px;color:#9aa8b6}
.bd-o.yes small,.bd-o.no small{display:block}
.bd-o:hover:not(:disabled){border-color:#ffc24b}
.bd-o.yes{border-color:#2fbf71;background:#12301f}
.bd-o.no{border-color:#ff5a5a;background:#331517}
.bd-o .ti{width:32px;height:32px;display:inline-flex}

/* deprem başlangıcı: kısa, engellemeyen başlık */
#qflash{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 4px 24px #000;animation:qfl 1.7s ease-out forwards}
#qflash b{font-size:84px;letter-spacing:.08em;color:#fff;font-family:inherit;animation:cshake .1s infinite}
#qflash span{font-size:20px;letter-spacing:.3em;color:#ffc24b;font-weight:700}
@keyframes qfl{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}

/* ===== GİRİŞ EKRANI: simetrik tasarım ===== */
.mn{text-align:center}
.mn::before{background:radial-gradient(ellipse 70% 62% at 50% 36%,rgba(4,7,22,.35) 0,rgba(4,7,22,.78) 72%,rgba(4,7,22,.92) 100%),linear-gradient(0deg,rgba(4,7,22,.97) 0,rgba(4,7,22,.82) 20%,transparent 42%)}
.mn-top{left:0;right:0;top:34px;justify-content:center;gap:14px}
.mn-top .pr svg{transform:scaleX(-1)}
.mn-main{left:0;right:0;top:70px;width:auto;display:flex;flex-direction:column;align-items:center}
.mn-title{align-items:center}
.mn-title .m1{font-size:46px;letter-spacing:.5em;margin:0 0 6px;padding-left:.5em}
.mn-title .m2{font-size:142px;letter-spacing:.01em;margin:0}
.mn-seis{left:0;top:auto;position:relative;width:1280px;height:60px;margin-top:6px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%,#000 72%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 28%,#000 72%,transparent 100%)}
.mn-seis .wa,.mn-seis .wb{position:absolute;inset:0}
.mn-seis .wb{transform:scaleX(-1)}
.mn-seis path{stroke-width:2.4}
.mn-tag{margin:8px 0 2px;font-size:28px}
.mn-sub{margin:0 0 20px;font-size:18px}
.mn-btns{flex-direction:column;gap:10px;width:auto}
.mn-btns .btn.primary{font-size:24px;padding:12px 46px}
.mn-btns .btn:not(.primary){font-size:17px;padding:9px 26px}
.mn-best{margin:14px 0 0;display:flex;align-items:baseline;justify-content:center;gap:12px;border:0;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);background:linear-gradient(90deg,transparent,rgba(255,178,62,.12),transparent);padding:7px 40px;min-width:0}
.mn-best small{letter-spacing:.2em}
.mn-best b{font-size:26px}
.mn-best em{white-space:nowrap}
.mn-best.empty{padding:7px 40px}
.mn-rings{position:absolute;left:50%;top:150px;width:0;height:0;pointer-events:none}
.mn-rings i{position:absolute;left:-210px;top:-210px;width:420px;height:420px;border-radius:50%;border:1.5px solid rgba(255,178,62,.45);opacity:0;animation:mnRing 6s ease-out infinite}
.mn-rings i:nth-child(2){animation-delay:2s}.mn-rings i:nth-child(3){animation-delay:4s}
@keyframes mnRing{0%{transform:scale(.35);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.mn-flow{left:140px;right:140px;bottom:62px;text-align:center}
.mn-flow li{justify-items:center}
.mn-flow i,.mn-flow li:nth-child(2) i,.mn-flow li:nth-child(3) i{left:50%;margin-left:-5px}
.mn-flow span{max-width:280px;font-size:13.5px}
.mn-foot{left:0;right:0;bottom:24px;text-align:center}
.mn-side{position:absolute;top:120px;bottom:120px;width:26px;pointer-events:none;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14);background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 14px)}
.mn-side.l{left:40px}.mn-side.r{right:40px}
.mn-side span{writing-mode:vertical-rl;font:600 11px/1 var(--fb);letter-spacing:.4em;color:#8d97c9;background:#0a0f26;padding:14px 3px;white-space:nowrap}
.mn-side.l span{transform:rotate(180deg)}
.mn-c{position:absolute;width:34px;height:34px;border:2px solid rgba(255,178,62,.7);pointer-events:none}
.mn-c.tl{left:22px;top:22px;border-right:0;border-bottom:0}.mn-c.tr{right:22px;top:22px;border-left:0;border-bottom:0}
.mn-c.bl{left:22px;bottom:22px;border-right:0;border-top:0}.mn-c.br{right:22px;bottom:22px;border-left:0;border-top:0}
@media (prefers-reduced-motion:reduce){.mn-rings i{animation:none}}

/* yapı güvenliği: yakalama oyunu */
.bc{position:absolute;inset:0;display:flex;gap:16px}
.bc-field{position:relative;flex:1;overflow:hidden;border-radius:14px;border:1.5px solid #3a4658;background:linear-gradient(180deg,#14233f 0,#1c3150 55%,#2a2f3a 100%);cursor:none;touch-action:none}
.bc-field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#ffc24b 0 22px,#222 22px 44px)}
.bc-legend{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:space-between;gap:12px;padding:0 14px;font-size:13px;font-weight:700;pointer-events:none;z-index:3}
.bc-legend .g{color:#7be0a6}.bc-legend .b{color:#ff8da6;text-align:right}
.bc-bucket{position:absolute;left:0;bottom:12px;width:150px;height:50px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px 10px 22px 22px;background:linear-gradient(180deg,#ffc24b,#e08a1e);color:#2a1a05;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:4;will-change:transform}
.bc-bucket svg{width:26px;height:26px}.bc-bucket b{font-size:12px;letter-spacing:.06em}
.bc-bucket.bump{animation:bcBump .22s}
@keyframes bcBump{0%{filter:brightness(1.6)}40%{filter:brightness(1.3)}100%{filter:none}}
.bc-i{position:absolute;left:0;top:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px;background:#e8edf5;color:#18202b;border:2px solid #9fb0c7;box-shadow:0 4px 10px rgba(0,0,0,.35);will-change:transform;z-index:2}
.bc-i svg{flex:0 0 26px;width:26px;height:26px;color:#42536b}.bc-i b{font-size:13px;line-height:1.15}
.bc-tower{width:230px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:14px;border:1.5px solid #3a4658;background:#10192a;padding:10px 14px 12px;position:relative}
.bc-tower>b{position:absolute;top:10px;font-size:12px;letter-spacing:.2em;color:#9aa8b6}
.bc-floors{display:flex;flex-direction:column-reverse;gap:3px;width:160px;align-items:stretch;min-height:0}
.bc-base{margin-top:6px;width:200px;text-align:center;font-size:11px;letter-spacing:.14em;font-weight:700;background:#4a3a28;color:#d9c9a8;padding:5px 0;border-radius:4px}
.bc-fl{height:34px;border-radius:4px;display:flex;gap:10px;align-items:center;justify-content:center;background:linear-gradient(180deg,#c9ccd3,#9ea4b0);border:1.5px solid #6c7686}
.bc-fl.b{background:linear-gradient(180deg,#d8c7a8,#b79f78)}
.bc-fl i{width:18px;height:16px;border-radius:2px;background:#ffe9a8;box-shadow:0 0 8px rgba(255,224,150,.7)}
.bc-fl.pop{animation:bcPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bcPop{0%{transform:translateY(-40px) scaleX(1.2);opacity:0}100%{transform:none;opacity:1}}
.bc-fl.crumble{animation:bcCr .38s forwards}
@keyframes bcCr{to{transform:translate(40px,30px) rotate(18deg);opacity:0}}
.bc-roof{height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:34px solid #c2493d;animation:bcPop .5s}
.bc-combo{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:40px;font-weight:900;color:#ffd166;text-shadow:0 3px 14px #000,0 0 22px rgba(255,200,60,.6);opacity:0;pointer-events:none;z-index:5;font-family:var(--fd)}
.bc-combo.on{animation:bcCombo .9s ease-out}
@keyframes bcCombo{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.bc-p{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:6;animation:bcP .7s ease-out forwards}
@keyframes bcP{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}

/* ===== yangın söndürücü atölyesi ===== */
.fxroot{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px}
.fx-steps{display:flex;gap:8px}.fx-steps span{flex:1;padding:8px 10px;border-radius:8px;background:#18202b;border:1.5px solid #2b3644;color:#8b9aa8;font-size:14px;font-weight:700;text-align:center}
.fx-steps span.on{border-color:#ffc24b;color:#ffc24b;background:#241d10}.fx-steps span.done{border-color:#2fbf71;color:#7be0a6;background:#12301f}
.fx-scene{position:relative;flex:1;border-radius:14px;overflow:hidden;border:1.5px solid #3a4658;cursor:crosshair;touch-action:none;user-select:none}
.fx-wall{position:absolute;inset:0 0 120px 0;background:linear-gradient(180deg,#27324c,#34415e)}
.fx-floor{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,#463a33,#2a211d);border-top:4px solid #1b1512}
.fx-br{position:absolute;left:46px;top:34px;width:120px;height:150px;border-radius:8px;background:#7c8794;border:3px solid #4d5663;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#101820;cursor:pointer}
.fx-br b{font-size:12px;letter-spacing:.08em}.fx-br small{font-size:12px;font-weight:800;color:#12301f;background:#7be0a6;padding:2px 8px;border-radius:4px}
.fx-br .lv{width:20px;height:54px;border-radius:6px;background:#d33;border:2px solid #600;box-shadow:inset 0 -26px 0 #a22;transition:transform .2s}
.fx-br.off .lv{transform:scaleY(-1)}.fx-br.off small{background:#ff8da6;color:#40101a}
.fx-br:hover{filter:brightness(1.15)}
.fx-outlet{position:absolute;left:50%;bottom:150px;width:70px;height:44px;margin-left:-35px;border-radius:8px;background:#d9d9d0;display:flex;gap:12px;align-items:center;justify-content:center;border:2px solid #8a8a80}
.fx-outlet i{width:8px;height:16px;border-radius:2px;background:#222}
.fx-flame{position:absolute;left:50%;bottom:150px;width:120px;height:150px;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none}
.fx-flame b{position:absolute;bottom:0;left:50%;width:80px;height:140px;margin-left:-40px;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 85%,#fff3b0 0,#ffb62e 40%,#ff5a1a 75%,transparent 100%);transform-origin:50% 100%;animation:fxF .38s ease-in-out infinite alternate;filter:blur(1px)}
.fx-flame b:nth-child(2){width:56px;margin-left:-62px;height:100px;animation-duration:.3s;animation-delay:.1s;opacity:.9}
.fx-flame b:nth-child(3){width:56px;margin-left:6px;height:112px;animation-duration:.45s;animation-delay:.05s;opacity:.9}
.fx-flame u{position:absolute;left:50%;bottom:-6px;width:150px;height:30px;margin-left:-75px;background:radial-gradient(ellipse,rgba(255,140,40,.55),transparent 70%)}
@keyframes fxF{from{transform:scale(1,.9) skewX(-4deg)}to{transform:scale(.92,1.08) skewX(4deg)}}
.fx-flame.out{opacity:0;transition:opacity .8s}
.fx-ext{position:absolute;right:50px;bottom:40px;width:96px;height:170px;background:none;border:0;cursor:pointer}
.fx-ext .tank{position:absolute;left:12px;bottom:0;width:72px;height:122px;border-radius:18px 18px 12px 12px;background:linear-gradient(90deg,#b11d1d,#e53b3b 45%,#a21818);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.fx-ext .tank::after{content:"";position:absolute;left:14px;right:14px;top:36px;height:30px;background:#f3ead0;border-radius:4px}
.fx-ext .hose{position:absolute;left:34px;top:6px;width:44px;height:50px;border:6px solid #222;border-bottom:0;border-left:0;border-radius:0 24px 0 0}
.fx-ext .pin{position:absolute;left:2px;top:14px;width:30px;height:30px;border-radius:50%;border:5px solid #ffd23f;z-index:2;animation:fxPin 1s ease-in-out infinite}
.fx-ext .pin.gone{display:none}
@keyframes fxPin{50%{transform:scale(1.18)}}
.fx-ext.held .tank{box-shadow:0 0 0 3px #ffc24b,0 6px 14px rgba(0,0,0,.5)}
.fx-ext small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;color:#c8d2de;font-weight:700}
.fx-p{position:absolute;width:10px;height:10px;border-radius:50%;background:#f3f6fa;pointer-events:none;opacity:.9;transition:transform .3s ease-out,opacity .3s;z-index:6}
.fx-gauge{position:absolute;left:46px;right:46px;top:8px;height:14px;border-radius:7px;background:#12161e;border:1.5px solid #3a4658;overflow:hidden}
.fx-gauge i{display:block;height:100%;background:linear-gradient(90deg,#ffb62e,#ff3a1a);width:100%}
.fx-gauge b{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#fff;text-shadow:0 1px 3px #000}

/* ===== yapı denetçisi ===== */
.ins{position:absolute;inset:0;border-radius:14px;overflow:hidden;border:1.5px solid #3a4658;cursor:none;touch-action:none;user-select:none;--mx:-300px;--my:-300px}
.ins-b{position:absolute;inset:0;background:linear-gradient(180deg,#cdbfa6,#b6a688)}
.ins-grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - 3px),rgba(80,70,55,.5) calc(25% - 3px) 25%,transparent 25%,transparent calc(50% - 3px),rgba(80,70,55,.5) calc(50% - 3px) 50%,transparent 50%,transparent calc(75% - 3px),rgba(80,70,55,.5) calc(75% - 3px) 75%,transparent 75%),linear-gradient(180deg,transparent calc(33.3% - 4px),rgba(80,70,55,.55) calc(33.3% - 4px) 33.3%,transparent 33.3%,transparent calc(66.6% - 4px),rgba(80,70,55,.55) calc(66.6% - 4px) 66.6%,transparent 66.6%)}
.ins-x{position:absolute;inset:0;background:linear-gradient(180deg,#0f2740,#16365a);-webkit-mask-image:radial-gradient(circle 110px at var(--mx) var(--my),#000 0,#000 72%,transparent 100%);mask-image:radial-gradient(circle 110px at var(--mx) var(--my),#000 0,#000 72%,transparent 100%)}
.ins-x::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(120,200,255,.18) 46px 48px),repeating-linear-gradient(0deg,transparent 0 46px,rgba(120,200,255,.18) 46px 48px)}
.ins-m{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:rgba(10,24,40,.85);border:1.5px solid #6fb5e8;color:#d8ecff;font-size:13px;font-weight:700;white-space:nowrap}
.ins-m svg{width:18px;height:18px}
.ins-m.found{border-color:#ff6f6f;background:#3a1316;color:#ffd0d0;animation:insPulse .5s}
.ins-m.wrong{border-color:#7be0a6;background:#12301f;color:#b8ffd5}
@keyframes insPulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
.ins-lens{position:absolute;left:0;top:0;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:4px solid #ffc24b;box-shadow:0 0 22px rgba(255,194,75,.55),inset 0 0 30px rgba(255,194,75,.15);pointer-events:none;transform:translate(0,0)}
.ins-tag{position:absolute;left:14px;top:10px;font-size:12px;letter-spacing:.2em;color:#3a3020;font-weight:800;pointer-events:none}

/* ===== arsa sondajı ===== */
.tr{position:absolute;inset:0;display:flex;gap:16px}
.tr-map{flex:1;display:grid;gap:5px;padding:12px;border-radius:14px;border:1.5px solid #3a4658;background:linear-gradient(180deg,#2c4a37,#223a2c)}
.tr-c{position:relative;border-radius:8px;border:1.5px solid rgba(255,255,255,.14);background:#3d6a4c;color:#e8f1e8;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;transition:transform .12s}
.tr-c:hover{transform:scale(1.04);border-color:#ffc24b}
.tr-c.wet{box-shadow:inset 0 0 0 100px rgba(74,143,184,.28)}
.tr-c.rev{color:#101820;text-shadow:0 1px 0 rgba(255,255,255,.35);animation:bcPop .3s}
.tr-c.sel{outline:3px solid #ffc24b;outline-offset:-3px;z-index:2}
.tr-side{width:250px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1.5px solid #3a4658;background:#10192a}
.tr-side>b{font-size:12px;letter-spacing:.2em;color:#9aa8b6}
.tr-p{display:flex;gap:5px}.tr-p i{flex:1;height:14px;border-radius:4px;background:#2b3644}.tr-p i.on{background:linear-gradient(180deg,#ffc24b,#e08a1e)}
.tr-leg{display:grid;gap:5px;font-size:13px;color:#c8d2de}.tr-leg span{display:flex;align-items:center;gap:8px}.tr-leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.tr-side .btn{margin-top:auto;font-size:18px;padding:12px}
.tr-side p{margin:0;font-size:13px;color:#9aa8b6;min-height:36px}

/* ===== giriş: tek, düzgün sismograf izi (soldan sağa kaydedilir) ===== */
.mn-seis{height:60px;margin-top:6px}
.mn-seis .wa,.mn-seis .wb{display:none}
.mn-seis svg{display:block}
.mn-seis .tr{fill:none;stroke:var(--ora);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:seisDraw 9s linear infinite;filter:drop-shadow(0 0 4px rgba(255,178,62,.6))}
@keyframes seisDraw{0%{stroke-dashoffset:1;opacity:1}58%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.mn-seis .pen{display:none}
.mn-seis{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
@media (prefers-reduced-motion:reduce){.mn-seis .tr{animation:none;stroke-dashoffset:0}}

/* ===== çarşı: büyük, sakin kartlar ===== */
.cs2{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px}
.cs2-top{display:flex;align-items:center;justify-content:space-between;font-size:26px}
.cs2-top b{display:flex;align-items:center;gap:12px}.cs2-top b svg{width:36px;height:36px}.cs2-top small{font-size:16px;color:#9aa8b6;font-weight:600}
#cs2D{display:flex;gap:10px}#cs2D i{width:44px;height:8px;border-radius:4px;background:#2b3644}#cs2D i.cur{background:#ffc24b}#cs2D i.ok{background:#2fbf71}#cs2D i.no{background:#ff5a5a}
.cs2-row{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cs2-c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:20px;border:2px solid #3a4658;background:linear-gradient(180deg,#18222f,#121a24);color:#eef2f5;cursor:pointer;transition:border-color .2s,transform .2s}
.cs2-c:hover{border-color:#ffc24b;transform:translateY(-3px)}
.cs2-c b{font-size:22px;letter-spacing:.02em}
.cs2-ic{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;color:#b8c4d2}.cs2-ic svg{width:100px;height:100px}
.cs2-bar{width:60%;height:8px;border-radius:4px;background:#2b3644;overflow:hidden}.cs2-bar i{display:block;height:100%;width:0;background:#7be0a6}
.cs2-c.hz.gas .cs2-ic::after{content:"";position:absolute;left:50%;top:-16px;width:90px;height:60px;margin-left:-45px;background:radial-gradient(ellipse at 50% 100%,rgba(190,240,170,.45),transparent 70%);animation:csGas 3s ease-in-out infinite}
.cs2-c.hz.spk .cs2-ic{animation:csSp 2.6s ease-in-out infinite}
.cs2-c.hz.blk .cs2-ic::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:44px;background:repeating-linear-gradient(135deg,#9a7448 0 12px,#7f5d38 12px 24px);border:3px solid #5d4428;border-radius:6px}
@keyframes csGas{0%,100%{opacity:.25;transform:translateY(8px)}50%{opacity:.8;transform:translateY(-8px)}}
@keyframes csSp{0%,100%{color:#b8c4d2}50%{color:#ffd166}}
.cs2-c.fixing{border-color:#ffc24b;pointer-events:none}.cs2-c.fixing .cs2-bar i{animation:csBar .85s linear forwards}
@keyframes csBar{to{width:100%}}

function afterHints(){
  const a=R.after,t=a.tasks,out=[];
  if(t.indexOf('window')>=0&&!R.winOpen)out.push({r:SPOT.win,l:'PENCEREYİ AÇ'});
  if(t.indexOf('gas')>=0&&!R.gasClosed)out.push({r:SPOT.valve,l:'GAZ VANASI'});
  if(t.indexOf('breaker')>=0&&!R.breakerOff)out.push({r:SPOT.brk,l:'ELEKTRİK PANOSU'});
  else if(t.indexOf('ext')>=0&&!a.extinguished&&a.fire)out.push({r:SPOT.ext,l:'SÖNDÜRÜCÜ'});
  const st={gas:R.gasClosed,window:R.winOpen,breaker:R.breakerOff,ext:a.extinguished||!a.fire};
  const pend=t.some(k=>k!=='exit'&&!st[k]);
  const stay=a.exiting&&R.people.some(p=>!p.hidden&&!p.evac);
  if(!pend&&(!a.exiting||stay))out.push({r:SPOT.door,l:'ÇIK'});
  return out;
}

  return Math.round(Math.max(1,Math.min(75,.275*(1-CT.lv[site.id]/3*.85)*(burning?1.75:1)*mult*100)));
}
function ctPaint(){
  ctLife();
  const layer=$c('layer');if(!layer)return;
  const targets={};CT.plan.spreads.forEach(s=>targets[s.to]=true);if(CT.plan.ignite)targets[CT.plan.ignite]=true;
  SITES.forEach(site=>{
    const el=layer.querySelector('[data-site="'+site.id+'"]');if(!el)return;
    const lv=CT.lv[site.id],burning=ctBurning(site.id),step=ctNext(site);
    el.classList.remove('lv1','lv2','lv3','afford','maxed','fire','safe','incoming');
    el.querySelectorAll('.ember,.mark,.hz-badge,.crisis-badge').forEach(n=>n.remove());el.classList.remove('crisis');
    el.querySelectorAll('.pip').forEach((p,i)=>p.classList.toggle('on',i<lv));
    el.setAttribute('aria-label',site.name+', kademe '+lv+' / 3'+(burning?', açık risk: '+CT.fire[site.id].h.name:''));
    const rk=ctSiteRisk(site,burning),rke=el.querySelector('.site-risk');if(rke)rke.innerHTML='Kayıp ≈ <i class="rk '+(rk<=12?'g':rk<=22?'y':rk<=34?'o':'r')+'"></i>%'+rk;
    const zn=document.querySelector('#cityroot .zone.z-'+site.id);if(zn)zn.setAttribute('class','zone z-'+site.id+(burning?' fire':'')+(lv?' lv'+lv:''));
    if(burning){
      el.classList.add('fire');const f=CT.fire[site.id],em=document.createElement('div');em.className='ember';em.innerHTML=ico(f.h.icon);el.appendChild(em);
      el.querySelector('.site-cost').textContent=f.h.name.split(' ')[0].toUpperCase();
      const bd=document.createElement('div');bd.className='hz-badge hz-'+f.h.id;bd.innerHTML='<i>'+ico(f.h.icon)+'</i>'+(f.held?'BU TUR TUTULDU':(f.tamed&&f.h.drain)?'YATIŞTI':(f.opened&&f.h.lock)?'ROTA AÇIK':HZ_SHORT[f.h.id]);el.appendChild(bd);el.title=f.h.name+' — '+f.h.rule;
    }else{
      if(lv>0)el.classList.add('lv'+lv);if(lv>=3)el.classList.add('safe','maxed');
      if(step&&step.cost<=CT.budget)el.classList.add('afford');
      el.querySelector('.site-cost').textContent=step?(step.cost+' ◆'):'KORUMALI';
    }
    const cr=CT.crises.find(c=>c.site===site.id);
    if(cr){el.classList.add('crisis');const cb=document.createElement('div');cb.className='crisis-badge';cb.innerHTML='<span>'+ico('siren')+'</span><b>'+Math.ceil(cr.t)+'</b>';el.appendChild(cb);}
    if(targets[site.id]&&!burning){
      const mk=document.createElement('div');mk.className='mark';
      if(ctSafe(site.id))mk.innerHTML=ico('shield');else{el.classList.add('incoming');mk.innerHTML=ico('warn');}
      el.appendChild(mk);
    }

  const threat={};CT.plan.spreads.forEach(s=>threat[[s.from,s.to].sort().join('-')]=true);
  ctCrisisBar();

    const key=line.dataset.link,ab=key.split('-');
    line.classList.toggle('hot',(ctBurning(ab[0])||ctBurning(ab[1]))&&!threat[key]);line.classList.toggle('threat',!!threat[key]);
  });
}
function ctPlanBar(){
  const bar=$c('planBar');if(!bar)return;
  if(CT.resolving||CT.over){bar.innerHTML='';return;}
  const chips=[];
  CT.plan.spreads.forEach(s=>{const to=ctById[s.to],from=ctById[s.from];
    chips.push(ctSafe(s.to)?'<span class="plan-chip safe">'+ico('shield')+' '+from.name+' → '+to.name+' · aynı risk burada yok</span>':'<span class="plan-chip">'+ico('hazard')+' '+from.name+' → '+to.name+' · aynı ihmal var</span>');});
  (CT.plan.erodes||[]).forEach(e=>chips.push('<span class="plan-chip">'+ico('drop')+' '+ctById[e.to].name+' kademesi düşecek</span>'));
  Object.keys(CT.fire).forEach(id=>{const f=CT.fire[id];if(f.held)return;
    if(f.h.drain&&!f.tamed)chips.push('<span class="plan-chip">'+ico('megaphone')+' '+ctById[id].name+' · −'+f.h.drain+' ◆ bütçe</span>');
    if(f.h.lock&&!f.opened)chips.push('<span class="plan-chip">'+ico('barrier')+' '+ctById[id].name+' · yatırım kilitli</span>');});
  if(CT.plan.ignite){const t=ctById[CT.plan.ignite];
    chips.push(ctSafe(t.id)?'<span class="plan-chip safe">'+ico('shield')+' '+t.name+' · yeni risk engellenecek</span>':'<span class="plan-chip">'+ico('bolt')+' Yeni risk: '+t.name+'</span>');}
  if(!chips.length)chips.push('<span class="plan-chip safe">'+ico('shield')+' Bu tur yeni tehdit yok</span>');
  bar.innerHTML=chips.join('');
}

function ctMissionArrive(){
  if(!CT||CT.over||!$c('missions')||CT.mAct.length>=1)return;
  const id=CT.mQ.find(i=>!ctPerk(i));
  if(!id)return;
  CT.mQ=CT.mQ.filter(i=>i!==id);CT.mAct=[id];CT.mNew=id;Sfx.warn();ctMissions();

}
function ctMissionDone(id){
  const cur=CT;
  if(CT.mAct[0]!==id){CT.mAct.forEach(x=>CT.mQ.unshift(x));CT.mQ=CT.mQ.filter(x=>x!==id);CT.mAct=[id];CT.mNew=null;}
  ctMissions();
  setTimeout(()=>{if(CT!==cur)return;const el=document.querySelector('.mission[data-mission="'+id+'"]');if(el)el.classList.add('leave');
    setTimeout(()=>{if(CT!==cur)return;CT.mAct=[];ctMissions();setTimeout(()=>{if(CT===cur)ctMissionArrive();},700);},450);},2600);

function ctLevelUp(site){
  ctOrderRecord(site);
  CT.lv[site.id]++;
  const completed=MISSIONS.filter(m=>ctMDone(m)&&!ctPerk(m.id)),jd=completed[0];
  completed.forEach(m=>{CT.doneMissions[m.id]=true;});
  if(CT.lv[site.id]>=3)Sfx.win();else Sfx.fix();
  ctFloat(site,CT.lv[site.id]>=3?'KORUMALI':'KADEME '+CT.lv[site.id]);
  if(jd){CT.doneMissions[jd.id]=true;Sfx.win();ctMissionDone(jd.id);return['✓ GÖREV TAMAMLANDI · '+jd.name,jd.fact+' Kazanılan: '+jd.perk+'.'];}
  return null;
}
function ctBuy(site,step){
  if(!CT||CT.resolving||CT.over||S.mode!=='cmap'||step!==ctNext(site)||ctOrderCost(site,step)>CT.budget)return;
  if(ctBurning(site.id)){const f=CT.fire[site.id];if(!(f.h.lock&&f.opened))return;}
  if(!ctOrderCanWork(site,true))return;
  CT.budget-=ctOrderCost(site,step);const m=ctLevelUp(site);
  ctClosePop();ctPaint();ctPlanBar();ctHud();
  if(m)ctToast(m[0],m[1],false);else ctToast(step.label,step.fact,false);
}
function ctRespond(site,opt,cost){
  const f=CT.fire[site.id];if(!f||cost>CT.budget)return;CT.budget-=cost;
  if(opt.kind==='sondur'){delete CT.fire[site.id];CT.putOut++;CT.plan.spreads=CT.plan.spreads.filter(x=>x.from!==site.id);CT.plan.erodes=(CT.plan.erodes||[]).filter(x=>x.from!==site.id);Sfx.fix();ctFloat(site,'ÇÖZÜLDÜ');ctToast('Risk giderildi · '+site.name,f.h.fact,false);}
  else if(opt.kind==='tut'){f.held=true;CT.plan.spreads=CT.plan.spreads.filter(x=>x.from!==site.id);CT.plan.erodes=(CT.plan.erodes||[]).filter(x=>x.from!==site.id);Sfx.safe();ctFloat(site,'BU TUR TUTULDU');ctToast('Geçici önlem · '+site.name,'Bu tur etkisiz. Ama risk duruyor: sonraki tur yine aynı kuralla işleyecek.',true);}
  else if(opt.kind==='yatistir'){f.tamed=true;Sfx.safe();ctFloat(site,'BÜTÇE KAYBI DURDU');ctToast('Bilgi akışı düzenlendi · '+site.name,'Bütçe kaybı durdu. Risk duruyor ve deprem anında hâlâ sayılacak.',true);}
  else if(opt.kind==='ac'){f.opened=true;Sfx.safe();ctFloat(site,'YATIRIM AÇILDI');ctToast('Alternatif rota işaretlendi · '+site.name,'Artık bu mahalleye yatırım yapabilirsin. Tıkalı yol duruyor.',true);}
  ctClosePop();ctPaint();ctPlanBar();ctHud();
}

/* ---------- tur akışı ---------- */
function ctIgnite(site,hazard){
  if(ctBurning(site.id))return;
  CT.fire[site.id]={h:hazard||ctPick(HAZARDS),held:false,tamed:false,opened:false,tried:false};CT.totalFires++;Sfx.warn();
}
function ctMakePlan(){
  const spreads=[],erodes=[];
  Object.keys(CT.fire).forEach(id=>{
    const f=CT.fire[id],from=ctById[id];if(f.held)return;
    const free=from.nb.filter(n=>!ctBurning(n));
    for(let k=0;k<(f.h.spread||0)&&free.length;k++){const t=free.splice(Math.floor(Math.random()*free.length),1)[0];spreads.push({from:id,to:t});}
    if(f.h.erode){const hd=from.nb.filter(n=>CT.lv[n]>0);if(hd.length)erodes.push({from:id,to:ctPick(hd)});}
  });
  const calm=SITES.filter(s=>!ctBurning(s.id)&&!spreads.some(sp=>sp.to===s.id));
  CT.plan={spreads,ignite:calm.length?ctPick(calm).id:null,erodes};
}
function ctStartTurn(){
  if(ctCheckGameOver())return;
  CT.budget+=ctIncome();CT.visit=true;ctMakePlan();if(CT.turn>=2)Sfx.safe();
  CT.clock=0;CT.crisisQ=[];
  // Eşit tur yükü: okuma hızından bağımsız, bütün acil riskler tur başında görünür.
  if(CT.turn>=2)for(let i=0;i<(CT.turn>=4?2:1);i++)ctSpawnCrisis();
  ctBuildOrder();
  if($c('btnEndTurn')){ctPaint();ctPlanBar();ctHud();$c('btnEndTurn').disabled=false;$c('btnEndTurn').textContent='TURU BİTİR →';
    if(CT.turn===CT.quakeTurn-1&&!CT.fore){CT.fore=true;ctForeshock();}
    if(CT.turn>=2)setTimeout(ctMissionArrive,900);}
}
function ctFly(from,to,done){

  const layer=$c('layer');if(!layer||!hazard){done();return;}
  const sp=document.createElement('div');sp.className='spark';sp.style.left=from.x+'%';sp.style.top=from.y+'%';sp.style.transitionDuration=CT_SPARK+'s';layer.appendChild(sp);Sfx.spark();
  requestAnimationFrame(()=>{sp.style.left=to.x+'%';sp.style.top=to.y+'%';});
  setTimeout(()=>{
    if(CT!==current||!$c('layer')){done();return;}
    sp.remove();
    if(ctBurning(to.id)){done();return;}
    if(ctSafe(to.id)){CT.blocked++;Sfx.safe();const el=document.createElement('div');el.className='blocked';el.style.left=to.x+'%';el.style.top=(to.y-6)+'%';el.textContent='ENGELLENDİ';layer.appendChild(el);setTimeout(()=>el.remove(),1200);
      ctToast('Zincir kırıldı · '+to.name,'Tam hazır mahallede aynı ihmal yok. Bir mahallenin hazırlığı komşusunu da korur.',false);}
    else{Sfx.warn();ctIgnite(to,hazard);ctToast('Komşuda da aynı ihmal · '+to.name,'Aynı eski tesisat ve alışkanlıklar burada da vardı; denetlenmediği için risk açığa çıktı.',true);}
    ctPaint();done();
  },CT_SPARK*1000);
}
function ctEndTurn(){
  if(!CT||S.paused||document.hidden||CT.resolving||CT.over||S.mode!=='cmap')return;
  if(CT.crises.length&&!CT.endWarn){CT.endWarn=true;Sfx.nope();ctToast('Acil risk var!','Önce önlemi uygula. Yine de turu bitirmek istersen tekrar bas: çözülmeyen acil risk açığa çıkar.',true);setTimeout(()=>{if(CT)CT.endWarn=false;},6000);return;}
  CT.endWarn=false;CT.crises.slice().forEach(ctCrisisFail);CT.crisisQ=[];
  if(ctCheckGameOver())return;
  const current=CT;CT.resolving=true;Sfx.click();ctClosePop();
  $c('btnEndTurn').disabled=true;$c('btnEndTurn').textContent='TUR İŞLENİYOR…';$c('planBar').innerHTML='';

function ctSpawnCrisis(){
  const free=new Set(SITES.filter(s=>!ctBurning(s.id)&&!ctSafe(s.id)&&!CT.crises.some(c=>c.site===s.id)).map(s=>s.id));
  if(!free.size)return;

  Object.keys(CRISIS_POOL).forEach(hz=>CRISIS_POOL[hz].forEach(e=>{if(free.has(e.site))cands.push({hz,site:e.site,t:e.t});}));

/* Aynı tur sayısındaki bütçe ve ücretsiz tatbikat fırsatlarıyla ulaşılabilir
   nüfus ağırlıklı hazırlık. DP: harcama / kullanılan ücretsiz kademe. */
const ctReferenceCache={};
function ctReference(turn){
  if(ctReferenceCache[turn])return ctReferenceCache[turn];
  const cash=CT_START+CT_INCOME*(turn-1),free=turn;
  let dp=new Map([['0,0,0',0]]);
  SITES.forEach(site=>{
    const next=new Map();
    dp.forEach((value,key)=>{const [spent,used,built]=key.split(',').map(Number);
      for(let lv=0;lv<=3;lv++)for(let f=0;f<=Math.min(lv,free-used);f++){
        // Ücretsiz kademe en pahalı basamağı karşılar; bu iyimser bir üst sınırdır.
        const cost=site.steps.slice(0,lv-f).reduce((a,x)=>a+x.cost,0);
        if(spent+cost>cash||built+lv>turn*2)continue;
        const k=(spent+cost)+','+(used+f)+','+(built+lv),v=value+site.pop*.85*lv/3;
        if(v>(next.get(k)??-1))next.set(k,v);
      }
    });dp=next;
  });
  return ctReferenceCache[turn]=Math.max(...dp.values())/CT_POP;
}
function ctBaseScore(){
  const prevention=SITES.reduce((v,s)=>v+s.pop*.85*CT.lv[s.id]/3,0)/CT_POP;
  const exposed=SITES.reduce((v,s)=>v+(ctBurning(s.id)?s.pop*.18:0),0)/CT_POP;
  return Math.round(Math.max(0,Math.min(1,Math.min(1,prevention/ctReference(CT.quakeTurn))-(exposed+Math.min(.15,CT.risk*.002))/ctReference(CT.quakeTurn)))*100);
}
function ctResults(mag,quiet){

  let mult=1+CT.risk*.008;if(ctPerk('koridor'))mult*=.85;if(ctPerk('konut'))mult*=.80;if(CT.drillProof.itfaiye)mult*=.95;
  const rows=SITES.map(site=>{const lv=CT.lv[site.id],onFire=ctBurning(site.id);
    const rate=Math.max(.01,Math.min(.75,severity*(1-lv/3*.85)*(onFire?1.75:1)*mult));return{site,lv,onFire,rate,lost:Math.round(site.pop*rate)};});
  const lost=rows.reduce((a,r)=>a+r.lost,0),saved=CT_POP-lost,ratio=saved/CT_POP;
  const score=ctFairScore(),stars=score>=85?3:score>=68?2:score>=50?1:0,missions=MISSIONS.filter(m=>ctPerk(m.id)).length;
  CT.res={scoreParts:ctOrderScoring(),mag,prep,burning,rows,lost,saved,stars,missions,score};
  if(!quiet)go('cres');
}

function ctBuildOrder(){CT.order=null;return;/* dakika/sıralı görev sistemi kaldırıldı: bütçe ile kademe al ya da ücretsiz tatbikat yap */
  const old=CT.orderHistory.find(p=>p.turn===CT.turn);if(old){CT.order=old;return;}
  const open=SITES.filter(s=>!ctBurning(s.id)&&!CT.crises.some(c=>c.site===s.id));
  const pool=open.length>=2?open:SITES;
  let pairs=[];for(const a of pool)for(const id of a.nb){const b=pool.find(s=>s.id===id);if(b)pairs.push([a,b]);}
  if(!pairs.length&&pool.length>=2)pairs=[[pool[0],pool[1]]];
  if(!pairs.length){CT.order=null;return;}
  // Tekrar önleme: önceki turlarda görev alan mahalleler (özellikle son tur) ve aynı ikili geri sayılır;
  // kademesi dolu mahalle işe yaramaz; ucuz basamak hafifçe tercih edilir.
  const hist=CT.orderHistory,uses=id=>hist.filter(p=>p.a===id||p.b===id).length,prev=hist[hist.length-1];
  const cost=s=>ctNext(s)?ctNext(s).cost:0;
  pairs.forEach(pr=>{const a=pr[0],b=pr[1];
    const same=hist.some(p=>(p.a===a.id&&p.b===b.id)||(p.a===b.id&&p.b===a.id));
    pr.score=(uses(a.id)+uses(b.id))*10+(same?100:0)+(prev&&(prev.a===a.id||prev.b===a.id||prev.a===b.id||prev.b===b.id)?8:0)+
      (uses(a.id)?4:0)+(ctSafe(a.id)?30:0)+(ctSafe(b.id)?30:0)+(cost(a)+cost(b))*.4+Math.random()*2;});
  pairs.sort((x,y)=>x.score-y.score);
  const pair=pairs[0],a=pair[0],b=pair[1];
  const p={turn:CT.turn,a:a.id,b:b.id,index:0,left:30,spent:0,detours:0,blocked:0,goals:{},labels:{}};
  for(const site of pair){const step=ctNext(site);p.goals[site.id]=Math.min(3,CT.lv[site.id]+1);p.labels[site.id]=step?step.label:'Mevcut önlemleri denetle';}
  CT.order=p;CT.orderHistory.push(p);
}
function ctOrderTarget(){const p=CT&&CT.order;return !p?null:p.index===1?p.a:p.index===2?p.b:null;}

function ctOrderStep(i){
  const p=CT.order;if(!p||p.index!==i||CT.over||CT.resolving||S.paused||document.hidden||S.mode!=='cmap')return;
  if(i===0){if(p.left<4){ctToast('Ekip süresi yetmiyor','Keşif için 4 dk gerekir; acil riskleri çöz veya turu bitir.',true);return;}ctOpenSite(ctById[p.a]);return;}
  if(i===1||i===2){const site=ctById[i===1?p.a:p.b];
    if(CT.lv[site.id]>=p.goals[site.id]){if(p.left<8){ctToast('Ekip süresi yetmiyor','Mevcut çalışmayı doğrulamak 8 dk gerektirir.',true);return;}ctOrderSpend(8);p.index++;Sfx.safe();ctMissions();ctHud();return;}

  CT.plan.spreads=CT.plan.spreads.filter(x=>![p.a,p.b].includes(x.to));CT.plan.erodes=(CT.plan.erodes||[]).filter(x=>![p.a,p.b].includes(x.to));if([p.a,p.b].includes(CT.plan.ignite))CT.plan.ignite=null;
  p.blocked=before-CT.plan.spreads.length-CT.plan.erodes.length-(CT.plan.ignite?1:0);CT.blocked+=p.blocked;
  Sfx.win();ctFloat(ctById[p.b],'GÜVENLİK HATTI TAMAM');ctOrderDraw();ctToast('Dört adım, tek güvenlik hattı',p.spent+' dk harcandı; '+p.left+' dk kaldı. '+(p.blocked?p.blocked+' yaklaşan risk engellendi.':'İki mahalledeki hazırlık ortak kontrolden geçti.'),false);ctPaint();ctPlanBar();ctHud();
}

  box.querySelectorAll('[data-order]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();ctOrderStep(+el.dataset.order);});el.addEventListener('mouseenter',()=>ctHighlight([+el.dataset.order===2?p.b:p.a]));el.addEventListener('mouseleave',()=>ctHighlight([]));});

<script>
/* =========================================================
   drills.js — mahalleye özel tatbikatlar + tehlike mikro oyunları
   DOM tabanlı, kendi kendine yeten mini oyunlar (kütüphane yok).
   city.js'den sonra, game.js'den önce yüklenir.
   Site tatbikatı:  drillOpen('okul', site)           → 0-3 yıldız → ücretsiz kademe
   Tehlike mikro:   drillOpen('hz:gaz', site, {...})  → başarı/başarısız → haritaya dön
   ========================================================= */
let DR=null;
const DRILLS={};
const $e=(tag,cls,html)=>{if(tag==='div'&&['cs-it','ok-kid','lm-b','if-c','cm-c'].some(c=>cls&&(cls===c||cls.startsWith(c+' '))))tag='button';const e=document.createElement(tag);if(tag==='button')e.type='button';if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const drShuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const drR=(a,b)=>a+Math.random()*(b-a);
const drClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Tekrar önleme: havuzdan n öğe seç; bu kampanyada daha önce gösterilmemişleri önceler.
   Havuz tükenirse en eski görülenlerden devam eder. */
function drFresh(key,pool,n){
  const seen=(typeof CT==='object'&&CT)?(CT.seen||(CT.seen={})):{};
  const hist=seen[key]||(seen[key]=[]);
  let pick=drShuf(pool.map((_,i)=>i).filter(i=>hist.indexOf(i)<0)).slice(0,n);
  if(pick.length<n)pick=pick.concat(hist.filter(i=>pick.indexOf(i)<0).slice(0,n-pick.length));
  seen[key]=hist.filter(i=>pick.indexOf(i)<0).concat(pick);
  return drShuf(pick.map(i=>pool[i]));
}
const DRILL_LABEL={
  okul:['school','Okula git','Tahliye tatbikatı'],eskiliman:['wall','Tarihi duvara git','Duvar güvenlik taraması'],hastane:['hospital','Hastaneye git','Hastane hazırlık planı'],
  carsi:['shop','Çarşıya git','Dükkân güvenlik turu'],itfaiye:['firstaid','Merkeze git','Tahliye güzergâhı planı'],su:['drop','Depoya git','Hat izolasyonu'],
  cami:['mosque','Meydana git','Toplanma alanı kurulumu'],liman:['anchor','Limana git','Öncelikli tahliye'],konut:['home','Eve gir','Ev tatbikatı']
};

/* ---------- çerçeve ---------- */
function drillOpen(key,site,opts){
  const def=DRILLS[key];if(!def)return;
  const d={key,def,site,opts:opts||{},micro:key.indexOf('hz:')===0,t:0,limit:def.limit,running:false,done:false,timers:[],iv:null,s:{},stage:null,last:0};
  d.hint=(t,bad)=>{const e=document.getElementById('dhint');if(e){e.textContent=t;e.classList.toggle('bad',!!bad);}};
  d.info=t=>{const e=document.getElementById('drScore');if(e)e.innerHTML=t;};
  d.clock=0;d.jobs=[];
  d.later=(ms,fn)=>{d.jobs.push({at:d.clock+ms/1000,fn});};
  d.pop=(el,text,good)=>{const st=d.stage;if(!st||!el)return;const sr=st.getBoundingClientRect(),er=el.getBoundingClientRect(),k=(st.offsetWidth?sr.width/st.offsetWidth:1)||1;
    const f=$e('div','dr-float'+(good?' good':' bad'),text);f.style.left=((er.left+er.width/2-sr.left)/k)+'px';f.style.top=((er.top-sr.top)/k)+'px';st.appendChild(f);setTimeout(()=>f.remove(),900);};

function drillTick(){

  build(d,st){
    const W=9,H=5,start=[0,4],T=[[8,0],[8,4]];let blocked,opt;
    const bfs=(a,b,bl)=>{const q=[[a[0],a[1],0]],seen={};seen[a[0]+','+a[1]]=1;while(q.length){const [x,y,n]=q.shift();if(x===b[0]&&y===b[1])return n;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx<0||ny<0||nx>=W||ny>=H||seen[k]||bl[k])return;seen[k]=1;q.push([nx,ny,n+1]);});}return -1;};
    for(let tr=0;tr<80;tr++){

      opt=[bfs(start,T[0],blocked),bfs(start,T[1],blocked)];if(opt[0]>0&&opt[1]>0&&opt[0]>=11&&opt[1]>=9)break;

    const g=st.querySelector('#ifG'),cells={};
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const k=x+','+y,isB=!!blocked[k],pole=isB&&((x+y)%3===0),el=$e('div','if-c'+(isB?' bl'+(pole?' pl':' cr'):' fr'),isB?ico(pole?'pole':'wall')+'<small>'+(pole?'DİREK':'ÇATLAK')+'</small>':'');
      if(x===0&&y===4){el.className='if-c stn';el.innerHTML=ico('houses')+'<small>BAŞLA</small>';}
      if(x===8&&y===0){el.className='if-c tgt';el.innerHTML=ico('tent')+'<em>A</em><small>TOPLANMA</small>';}
      if(x===8&&y===4){el.className='if-c tgt';el.innerHTML=ico('tent')+'<em>B</em><small>TOPLANMA</small>';}
      el.style.gridColumn=x+1;el.style.gridRow=y+1;g.appendChild(el);cells[k]=el;el.addEventListener('click',()=>ifClick(d,x,y));
    }
    const me=$e('div','if-me',person('adult',3));g.appendChild(me);
    d.s={W,H,blocked,cells,me,path:[[0,4]],T,cur:0,opt,len:[0,0],done:[false,false]};

  start(d){d.hint('Ok tuşlarıyla yürü: önce Toplanma Alanı A\'ya ulaş. Enkazdan ve direklerden kaç.');},
  key(d,e){const k=e.key.toLowerCase(),m={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]}[k];
    if(m){e.preventDefault();const h=d.s.path[d.s.path.length-1];ifClick(d,h[0]+m[0],h[1]+m[1]);}

    else if(k==='r'){e.preventDefault();ifResetPath(d);}},
  score(d){const s=d.s,r=[0,1].map(i=>s.done[i]?Math.min(1,s.opt[i]/s.len[i]):0),rel=(r[0]+r[1])/2;
    return{ratio:rel*(.86+.14*(1-d.t/d.limit)),lines:['Toplanma Alanı A: '+(s.done[0]?'ulaşıldı · '+s.len[0]+' adım (en kısa '+s.opt[0]+')':'ulaşılamadı'),'Toplanma Alanı B: '+(s.done[1]?'ulaşıldı · '+s.len[1]+' adım (en kısa '+s.opt[1]+')':'ulaşılamadı')]};}
};
function ifInfo(d){const s=d.s,t=document.getElementById('ifT');if(!t)return;
  const row=(i,n)=>'<div class="if-tr'+(s.done[i]?' ok':s.cur===i?' on':'')+'">'+ico('tent')+'<b>Toplanma Alanı '+n+'</b><i>'+(s.done[i]?s.len[i]+' adım'+(s.len[i]===s.opt[i]?' · en kısa!':''):s.cur===i?(s.path.length-1)+' adım':'—')+'</i></div>';

function ifUndo(d){const s=d.s;if(!d.running||d.done||s.cur>1||s.path.length<2)return;s.path.pop();ifRedraw(d);Sfx.click();}
function ifResetPath(d){const s=d.s;if(!d.running||d.done||s.cur>1||s.path.length<2)return;s.path=[[0,4]];ifRedraw(d);Sfx.click();}
function ifClick(d,x,y){
  const s=d.s;if(!d.running||d.done||s.cur>1)return;if(x<0||y<0||x>=s.W||y>=s.H)return;const k=x+','+y;
  const last=s.path[s.path.length-1];

  if(s.path.length>1){const pv=s.path[s.path.length-2];if(pv[0]===x&&pv[1]===y){ifUndo(d);return;}}
  if(Math.abs(last[0]-x)+Math.abs(last[1]-y)!==1)return;
  if(s.blocked[k]){Sfx.nope();d.shake();d.pop(s.cells[k],'Geçilemez!',false);return;}
  if(s.path.some(p=>p[0]===x&&p[1]===y)){Sfx.nope();return;}
  s.path.push([x,y]);Sfx.pick();ifRedraw(d);
  const T=s.T[s.cur];
  if(x===T[0]&&y===T[1]){s.done[s.cur]=true;s.len[s.cur]=s.path.length-1;if(!s.routes)s.routes=[];s.routes[s.cur]=s.path.map(p=>p.slice());d.pop(s.cells[k],s.len[s.cur]===s.opt[s.cur]?'EN KISA!':s.len[s.cur]+' adım','good');Sfx.ext();
    s.cells[k].classList.add('ok');s.cur++;
    if(s.cur>1){ifInfo(d);d.later(700,()=>d.finish());}
    else{d.later(500,()=>{s.path=[[0,4]];ifRedraw(d);d.hint('Şimdi Toplanma Alanı B\'ye giden en kısa yolu bul.');});}}
}

/* ---------- CAMİ MEYDANI: toplanma alanı ---------- */
DRILLS.cami={icon:'mosque',title:'Toplanma alanı kurulumu',limit:70,
  sub:'Meydan, depremden sonra mahalle halkının toplanacağı güvenli alan olacak. Çadırı, suyu, ilk yardımı ve kayıp aile noktasını doğru yerlere kur.',
  rules:['Önce sağdaki listeden bir <b>eşya seç</b> (ya da <b>1–4</b> tuşları), sonra meydanda bir hücreye tıkla (ya da <b>ok tuşlarıyla</b> gez, <b>Boşluk</b> ile yerleştir). Yerleştirilmişe tekrar basınca geri alınır.','<b>Kırmızı taralı</b> hücreler tehlikeli: <b>minare düşme alanı</b> ve <b>elektrik hattı</b>. Oraya kurma.','Seçili eşya için <b>yeşil noktalı</b> hücreler uygundur. <b>İlk yardım</b> yola bitişik sütuna, <b>çadırlar</b> birbirine değmeyecek şekilde kurulur. Bitince <b>Enter</b>.'],
  learn:'Toplanma alanı yüksek yapılardan, elektrik hatlarından ve enkaz düşme alanından uzak, yola yakın ve geniş olmalı. Çadırlar arası boşluk yangın ve izdiham riskini azaltır; ilk yardım ve su noktası ambulansın ulaşabileceği yerde olmalıdır.',
  build(d,st){
    const W=8,H=5,danger={},bld={},road={};
    [[0,1],[1,1],[0,2],[1,2],[0,3],[1,3]].forEach(p=>bld[p[0]+','+p[1]]=1);
    [[2,1],[2,2],[2,3]].forEach(p=>danger[p[0]+','+p[1]]=1);
    [[4,0],[5,0]].forEach(p=>danger[p[0]+','+p[1]]=1);
    for(let y=0;y<H;y++)road[7+','+y]=1;
    st.innerHTML='<div class="cm"><div class="cm-grid" id="cmG"></div><div class="cm-tray" id="cmT"></div></div>';
    const g=st.querySelector('#cmG'),cells={};
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const k=x+','+y;let cls='cm-c',txt='';
      if(bld[k]){cls+=' bd';txt=(x===0&&y===2)?ico('mosque')+'<small>CAMİ</small>':'';}
      else if(danger[k]){cls+=' dg';txt=(k==='4,0')?ico('bolt')+'<small>ELEKTRİK</small>':(k==='2,2')?ico('minaret')+'<small>MİNARE</small>':'';}
      else if(road[k]){cls+=' rd';txt=y===2?'YOL':'';}
      const el=$e('div',cls,txt);el.style.gridColumn=x+1;el.style.gridRow=y+1;g.appendChild(el);cells[k]=el;el.addEventListener('click',()=>{d.s.cx=x;d.s.cy=y;cmClick(d,x,y);});
    }
    const items=[{id:'tent',ic:ico('tent'),n:'Çadır',c:3,w:'birbirine değmesin'},{id:'water',ic:ico('tap'),n:'Su noktası',c:1,w:'tehlikeden uzak'},{id:'aid',ic:ico('firstaid'),n:'İlk yardım',c:1,w:'yola bitişik'},{id:'lost',ic:ico('clipboard'),n:'Kayıp aile noktası',c:1,w:'görünür yer'}];
    d.s={W,H,danger,bld,road,cells,items,sel:'tent',placed:{},wrong:0,cx:3,cy:2};
    cmTray(d);cmHints(d);
  },
  start(d){d.hint('Çadır seçili. Yeşil noktalı hücrelerden birine tıkla.');cmInfo(d);},
  key(d,e){const s=d.s,k=e.key.toLowerCase(),m={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[k];
    if(m){e.preventDefault();s.cx=drClamp(s.cx+m[0],0,s.W-1);s.cy=drClamp(s.cy+m[1],0,s.H-1);cmHints(d);}
    else if(k===' '){e.preventDefault();cmClick(d,s.cx,s.cy);}
    else if(k==='enter'){e.preventDefault();if(d.running&&!d.done)d.finish();}
    else if(k>='1'&&k<='4'){const it=s.items[+k-1];if(it&&cmLeft(d,it.id)>0){s.sel=it.id;Sfx.click();cmTray(d);cmHints(d);}}},
  score(d){
    const s=d.s,pl=Object.keys(s.placed).map(k=>({k,x:+k.split(',')[0],y:+k.split(',')[1],id:s.placed[k]})),n=pl.length;
    const aid=pl.find(p=>p.id==='aid'),aidOk=aid&&aid.x===6;
    const tents=pl.filter(p=>p.id==='tent');let iso=0;tents.forEach(t=>{if(!tents.some(o=>o!==t&&Math.abs(o.x-t.x)<=1&&Math.abs(o.y-t.y)<=1))iso++;});
    const tOk=tents.length?iso/Math.max(3,tents.length):0;
    return{ratio:n/6*.4+(aidOk?.3:0)+tOk*.3-.07*s.wrong,lines:['Yerleştirilen: '+n+' / 6 eşya.',aid?(aidOk?'İlk yardım yola yakın ✓':'İlk yardım yoldan uzak: ulaşım zor olur.'):'İlk yardım noktası kurulmadı.',tents.length?'Birbirinden ayrık çadır: '+iso+' / '+tents.length+'.':'Çadır kurulmadı.',s.wrong?s.wrong+' kez tehlikeli/uygunsuz hücreye kurmayı denedin.':'Hiç tehlikeli hücreye kurmadın.']};}
};
function cmLeft(d,id){const s=d.s,it=s.items.find(i=>i.id===id);return it.c-Object.keys(s.placed).filter(k=>s.placed[k]===id).length;}
function cmChecks(d){
  const s=d.s,pl=Object.keys(s.placed).map(k=>({x:+k.split(',')[0],y:+k.split(',')[1],id:s.placed[k]}));
  const tents=pl.filter(p=>p.id==='tent'),apart=tents.length>=3&&tents.every(t=>!tents.some(o=>o!==t&&Math.abs(o.x-t.x)<=1&&Math.abs(o.y-t.y)<=1));
  const aid=pl.find(p=>p.id==='aid');
  return[[tents.length+' / 3 çadır, birbirine değmiyor',apart],['İlk yardım yola bitişik',!!aid&&aid.x===6],['Su noktası kuruldu',pl.some(p=>p.id==='water')],['Kayıp aile noktası kuruldu',pl.some(p=>p.id==='lost')]];
}
function cmTray(d){
  const s=d.s,t=document.getElementById('cmT');if(!t)return;
  const ck=cmChecks(d),all=Object.keys(s.placed).length>=6;
  t.innerHTML='<h4>EŞYALAR</h4>'+s.items.map((i,n)=>'<button class="cm-it'+(s.sel===i.id?' sel':'')+'" data-i="'+i.id+'"'+(cmLeft(d,i.id)<=0?' disabled':'')+'><span>'+i.ic+'</span><b>'+i.n+'<small>'+i.w+'</small></b><kbd>'+(n+1)+'</kbd><i>×'+Math.max(0,cmLeft(d,i.id))+'</i></button>').join('')+
    '<h4 style="margin-top:6px">GÖREV LİSTESİ</h4><ul class="cm-ck">'+ck.map(c=>'<li class="'+(c[1]?'ok':'')+'"><span>'+(c[1]?'✓':'○')+'</span>'+c[0]+'</li>').join('')+'</ul>'+
    '<button class="btn primary cm-done'+(all?' ready':'')+'" id="cmDone">KURULUMU BİTİR <kbd>Enter</kbd></button>';
  t.querySelectorAll('.cm-it').forEach(b=>b.addEventListener('click',()=>{if(!d.running||d.done)return;s.sel=b.dataset.i;Sfx.click();cmTray(d);cmHints(d);}));
  t.querySelector('#cmDone').addEventListener('click',()=>{if(d.running&&!d.done)d.finish();});
}
function cmHints(d){
  const s=d.s;Object.keys(s.cells).forEach(k=>{const c=s.cells[k];c.classList.remove('good','near','best','cur');});
  const tents=Object.keys(s.placed).filter(k=>s.placed[k]==='tent').map(k=>k.split(',').map(Number));
  for(let y=0;y<s.H;y++)for(let x=0;x<s.W;x++){const k=x+','+y,c=s.cells[k];if(s.bld[k]||s.road[k]||s.danger[k]||s.placed[k])continue;
    if(!s.sel)continue;
    if(s.sel==='tent'&&tents.some(t=>Math.abs(t[0]-x)<=1&&Math.abs(t[1]-y)<=1))c.classList.add('near');
    else if(s.sel==='aid'&&x===6)c.classList.add('best');else c.classList.add('good');}
  const cc=s.cells[s.cx+','+s.cy];if(cc)cc.classList.add('cur');
}
function cmInfo(d){d.info('Yerleştirilen: <b>'+Object.keys(d.s.placed).length+' / 6</b>');}
function cmClick(d,x,y){
  const s=d.s;if(!d.running||d.done)return;const k=x+','+y,el=s.cells[k];
  if(s.placed[k]){delete s.placed[k];el.innerHTML='';el.classList.remove('pl');Sfx.drop();cmTray(d);cmInfo(d);cmHints(d);return;}
  if(!s.sel){d.hint('Önce sağdan bir eşya seç.',true);return;}
  if(s.bld[k]||s.road[k]){Sfx.nope();d.pop(el,'Buraya kurulmaz',false);return;}
  if(s.danger[k]){s.wrong++;d.shake();d.pop(el,'TEHLİKELİ ALAN!',false);d.hint('Kırmızı taralı alan: minare düşebilir, elektrik hattı var.',true);Sfx.nope();return;}
  const it=s.items.find(i=>i.id===s.sel);if(cmLeft(d,it.id)<=0){Sfx.nope();return;}
  if(it.id==='aid'&&x!==6)d.hint('İlk yardım yola bitişik sütunda (yeşil işaretli) olursa ambulans hemen ulaşır.',true);else d.hint('');
  s.placed[k]=it.id;el.innerHTML=it.ic;el.classList.add('pl');Sfx.pick();
  if(cmLeft(d,s.sel)<=0){const nx=s.items.find(i=>cmLeft(d,i.id)>0);s.sel=nx?nx.id:null;}
  cmTray(d);cmInfo(d);cmHints(d);
  if(Object.keys(s.placed).length>=6)d.hint('Hepsi kuruldu. Görev listesini kontrol et, sonra KURULUMU BİTİR (Enter).');
}

/* ---------- LİMAN: öncelikli tahliye sırası ----------
   Herkese yer var (9 kişi, 3 tekne × 3 yer): kimse açıkta kalmaz.
   Puan kaç kişinin bindiğine değil, SIRANIN doğruluğuna bağlıdır:
   yaralı → çocuk/yaşlı → sağlıklı. Her tekne dolunca kalkar; ilk kalkan ilk kurtulur. */
const LM_T={inj:{ty:'injured',n:'Yaralı',w:3},kid:{ty:'kid',n:'Çocuk',w:2},old:{ty:'old',n:'Yaşlı',w:2},ok:{ty:'adult',n:'Sağlıklı',w:1}};
const LM_N=9;
DRILLS.liman={icon:'anchor',title:'Öncelikli tahliye sırası',limit:55,
  sub:'Rıhtımdaki 9 kişinin hepsine yer var: 3 tekne × 3 yer. Sorun yer değil, SIRA: önce kim kalkmalı? Puan kaç kişinin bindiğine değil, önceliği doğru uygulayıp uygulamadığına göre verilir.',
  rules:['Önce bir <b>tekne seç</b>, sonra bekleyen kişilere tıkla: tekneye biner. Binmiş kişiye tıklarsan iner (tekne kalkmadıysa).','Sıra: <b>yaralı → çocuk ve yaşlı → sağlıklı</b>. Tekne <b>dolunca kalkar</b>; önce kalkan, önce kurtulur.','Herkes sonunda tahliye edilir. Bu oyun basitleştirilmiş bir plandır; gerçek tahliyede yetkililerin yönlendirmesini izle.'],
  learn:'Tahliyede önce yaralılara, sonra çocuklara ve yaşlılara öncelik verilir; sağlıklı kişiler en son çıkar. Amaç kimseyi geride bırakmamaktır: sakin ve kurallı bindirme hem hız hem güvenliktir.',
  build(d,st){
    st.innerHTML='<div class="lm"><div class="lm-quay"><small>İSKELE · 9 KİŞİ</small><div class="lm-ppl" id="lmP"></div></div><div class="lm-sea" id="lmB"></div></div>';
    const nInj=2+Math.floor(Math.random()*2),nKid=1+Math.floor(Math.random()*2),nOld=1+Math.floor(Math.random()*2);
    const types=drShuf([].concat(Array(nInj).fill('inj'),Array(nKid).fill('kid'),Array(nOld).fill('old'),Array(LM_N-nInj-nKid-nOld).fill('ok'))),ppl=[];
    const P=st.querySelector('#lmP');
    types.forEach((t,ti)=>{const p={t,boat:-1,el:$e('button','lm-p','<span>'+person(LM_T[t].ty,ti)+'</span><small>'+LM_T[t].n+'</small>')};P.appendChild(p.el);ppl.push(p);p.el.addEventListener('click',()=>lmClick(d,p));});
    const B=st.querySelector('#lmB'),boats=[];
    for(let i=0;i<3;i++){const b={i,left:false,order:-1,el:$e('div','lm-b','<div class="lm-hull">'+ico('boat')+'</div><div class="lm-seats"></div><small>Tekne '+(i+1)+' · 3 kişilik</small>')};B.appendChild(b.el);boats.push(b);b.el.addEventListener('click',()=>{if(!d.running||d.done||b.left)return;d.s.sel=i;lmBoats(d);Sfx.click();});}
    d.s={ppl,boats,sel:0,dep:0};lmBoats(d);
  },
  start(d){d.hint('Tekne seç → önce yaralıları bindir. Tekne dolunca kalkar.');d.info('Binen: <b>0 / '+LM_N+'</b>');},
  score(d){
    const s=d.s,idx=new Map();
    // Süre dolduysa kalanlar boş yerlere sırayla bindirilir (kimse açıkta kalmaz); sıra hatası olarak sayılır.
    const rem=s.boats.filter(b=>!b.left).map(b=>({b,n:s.ppl.filter(p=>p.boat===b.i).length})).sort((x,y)=>y.n-x.n||x.b.i-y.b.i);
    const cap={};rem.forEach((r,j)=>{r.b.tmp=s.dep+j;cap[r.b.i]=3-r.n;});
    s.ppl.forEach(p=>{if(p.boat>=0){const b=s.boats[p.boat];idx.set(p,b.left?b.order:b.tmp);}});
    const waiting=s.ppl.filter(p=>p.boat<0);
    waiting.forEach(p=>{const r=rem.find(x=>cap[x.b.i]>0);if(r){cap[r.b.i]--;idx.set(p,r.b.tmp);}else idx.set(p,s.dep+3);});
    let viol=0,pairs=0;
    for(let i=0;i<s.ppl.length;i++)for(let j=i+1;j<s.ppl.length;j++){
      const a=s.ppl[i],b=s.ppl[j],wa=LM_T[a.t].w,wb=LM_T[b.t].w;if(wa===wb)continue;pairs++;
      const hi=wa>wb?a:b,lo=wa>wb?b:a;if(idx.get(hi)>idx.get(lo))viol++;
    }
    const acc=pairs?1-viol/pairs:1,ratio=drClamp((acc-.5)/.5,0,1);
    const injLate=s.ppl.filter(p=>p.t==='inj'&&idx.get(p)>0).length;
    const midLate=s.ppl.filter(p=>LM_T[p.t].w===2&&s.ppl.some(q=>q.t==='ok'&&idx.get(q)<idx.get(p))).length;
    return{ratio,lines:[
      'Öncelik doğruluğu: %'+Math.round(acc*100)+(viol?' · '+viol+' sıra hatası':' · sıra bozulmadı ✓'),
      injLate?injLate+' yaralı ilk kalkan tekneye alınmadı; önce yaralılar kurtarılmalıydı.':'Yaralıların hepsi ilk kalkan teknedeydi ✓',
      midLate?midLate+' çocuk/yaşlı, sağlıklı bir yolcudan sonra kalktı.':'Çocuk ve yaşlılar sağlıklılardan önce kalktı ✓',
      waiting.length?'Süre doldu: bekleyenler sırayla bindirildi (kimse açıkta bırakılmaz).':'Herkes tahliye edildi: puan kişi sayısına değil, öncelik sırasına göre verilir.']};}
};
function lmBoats(d){
  const s=d.s;s.boats.forEach(b=>{
    const seats=b.el.querySelector('.lm-seats');seats.innerHTML='';
    s.ppl.filter(p=>p.boat===b.i).forEach(p=>seats.appendChild(p.el));
    for(let k=seats.children.length;k<3;k++)seats.appendChild($e('i','lm-seat',''));
    b.el.classList.toggle('sel',s.sel===b.i&&!b.left);b.el.classList.toggle('gone',b.left);
    b.el.querySelector(':scope > small').textContent='Tekne '+(b.i+1)+' · '+(b.left?(b.order+1)+'. kalkış':'3 kişilik');
  });
  s.ppl.filter(p=>p.boat<0).forEach(p=>document.getElementById('lmP').appendChild(p.el));
  const n=s.ppl.filter(p=>p.boat>=0).length;d.info('Binen: <b>'+n+' / '+LM_N+'</b>');
}
function lmClick(d,p){
  const s=d.s;if(!d.running||d.done)return;
  if(p.boat>=0){const b=s.boats[p.boat];if(b.left){Sfx.nope();return;}p.boat=-1;Sfx.drop();lmBoats(d);return;}
  let b=s.boats[s.sel];if(b.left||s.ppl.filter(q=>q.boat===b.i).length>=3){b=s.boats.find(x=>!x.left&&s.ppl.filter(q=>q.boat===x.i).length<3);if(!b){Sfx.nope();return;}s.sel=b.i;}
  p.boat=b.i;Sfx.pick();lmBoats(d);
  if(s.ppl.filter(q=>q.boat===b.i).length>=3){
    if(b.departing)return;b.departing=true;
    d.later(500,()=>{b.departing=false;const crew=s.ppl.filter(q=>q.boat===b.i);if(crew.length<3||b.left)return;
      b.left=true;b.order=s.dep++;b.el.classList.add('gone');Sfx.win();
      const top=Math.max.apply(null,s.ppl.filter(q=>!(q.boat>=0&&s.boats[q.boat].left)).map(q=>LM_T[q.t].w).concat([0])),mine=Math.min.apply(null,crew.map(q=>LM_T[q.t].w));
      if(top>mine&&crew.some(q=>LM_T[q.t].w<top))d.hint('Bu tekne kalktı ama içinde daha düşük öncelikli biri vardı; bekleyen daha öncelikli kişiler var.',true);
      else d.hint('Doğru sıra: tekne kalktı.');
      const nb=s.boats.find(x=>!x.left);if(nb)s.sel=nb.i;lmBoats(d);
      if(s.boats.every(x=>x.left))d.later(500,()=>d.finish());});
  }
}

/* =========================================================
   ÖNLEM MİNİ OYUNLARI (12-24 sn) — açık kalan riski kapatan doğru önlemi uygula
   Hiçbiri söndürme/müdahale değil: hepsi deprem ÖNCESİ hazırlık.
   ========================================================= */

/* ---------- deprem sonrası yangın riski: devrilen ısıtıcı, dökülen yanıcı, elektrik ---------- */
DRILLS['hz:yangin']={icon:'plug',title:'Deprem sonrası yangın önlemi',limit:28,
  hint:'Depremde devrilip yangın çıkaracak riskli öğeleri bul ve önlemini uygula. Sağlam öğelere dokunma.',
  build(d,st){
    const risky=drFresh('yf-risk',[['Duvara sabitlenmemiş elektrikli ısıtıcı','flame','Duvara sabitlendi'],['Rafta duran yanıcı sıvılar','cup','Alt rafa indirildi'],['Deprem şalteri olmayan pano','cable','Otomatik şalter takıldı'],['Prize yığılmış uzatma kabloları','plug','Yük dağıtıldı'],['Isı kaynağı yanında sprey kutuları','cylinder','Güvenli dolaba kondu'],['Sabitlenmemiş yakıt bidonu','fuel','Bidon sabitlendi']],3);
    const safe=drFresh('yf-safe',[['Alçak, sabitlenmiş kitaplık','brick'],['Yerinde yangın söndürücü','extinguisher'],['Duvara monte sabit lamba','bulb'],['Metal kapaklı sigorta kutusu','lock'],['Topraklı tek cihaz prizi','plug'],['Kapalı, sabit yakıt dolabı','shield']],3);
    st.innerHTML='<div class="mz"><div class="tg" id="tgG"></div><div id="tgQ"></div></div>';
    const G=st.querySelector('#tgG'),items=[];
    drShuf(risky.map(r=>({n:r[0],ic:r[1],fix:r[2],bad:true})).concat(safe.map(s=>({n:s[0],ic:s[1],bad:false})))).forEach(o=>{
      o.el=$e('button','tg-t'+(o.bad?' risk':''),'<span class="ti">'+ico(o.ic)+'</span><b>'+o.n+'</b><small>'+(o.bad?'riskli':'sağlam')+'</small>'+(o.bad?'<i class="ov">'+ico('bolt')+'</i>':''));
      G.appendChild(o.el);items.push(o);o.el.addEventListener('click',()=>yfClick(d,o));});
    d.s={items,fixed:0,wrong:0,det:false,phase:1};
  },
  start(d){d.info('Giderilen: <b>0 / 3</b>');},
  score(d){const s=d.s,ok=s.fixed>=3&&s.det;return{ok,ratio:ok?drClamp(1-d.t/d.limit*.6-s.wrong*.1,.2,1):s.fixed/3*.3,lines:[ok?'Üç riski giderdin ve deprem sonrası elektriği doğru kesmeyi öğrendin.':s.fixed<3?'Süre doldu: '+s.fixed+' / 3 risk giderildi.':'Elektriği doğru kesemedin: deprem sonrası önce ana şalter kapatılır.',s.wrong?s.wrong+' yanlış hamle yaptın.':'Hiç gereksiz müdahale yok.']};}
};
function yfClick(d,o){
  const s=d.s;if(!d.running||d.done||s.phase!==1||o.done)return;
  if(o.bad){o.done=true;s.fixed++;o.el.classList.add('fx');o.el.querySelector('small').textContent=o.fix;const ov=o.el.querySelector('.ov');if(ov)ov.remove();d.pop(o.el,'Giderildi','good');Sfx.fix();d.info('Giderilen: <b>'+s.fixed+' / 3</b>');
    if(s.fixed>=3)d.later(450,()=>yfPhase2(d));}
  else{s.wrong++;d.t+=1.5;d.shake();d.pop(o.el,'Sağlam! −1.5 sn',false);Sfx.nope();}
}
function yfPhase2(d){
  const s=d.s;s.phase=2;const g=document.getElementById('tgG'),q=document.getElementById('tgQ');if(!g||!q)return;g.style.display='none';

function qzShow(d){

  const O=document.getElementById('qzO');O.innerHTML='';

function qzPick(d,q,o,b){
  const s=d.s;if(!d.running||d.done||q.locked)return;q.locked=true;q.res=o.ok;
  if(o.ok){s.right++;b.classList.add('ok');Sfx.fix();d.pop(b,'Doğru','good');}
  else{s.wrong++;d.t+=1.5;b.classList.add('no');d.shake();Sfx.nope();d.pop(b,q.why,false);}
  d.later(o.ok?500:1300,()=>{s.i++;if(s.i>=s.qs.length)d.finish();else qzShow(d);});
}
function orInfo(d){const s=d.s,p=document.getElementById('orP');if(p)p.innerHTML=s.steps.map((x,i)=>'<i class="'+(i<s.next?'ok':i===s.next?'cur':'')+'"></i>').join('');d.info('Sıra: <b>'+s.next+' / 4</b>');}
function orClick(d,o){
  const s=d.s;if(!d.running||d.done||o.done)return;
  if(o.i===s.next){o.done=true;s.next++;o.el.classList.add('ok');o.el.querySelector('em').textContent=s.next;o.el.disabled=true;Sfx.pick();orInfo(d);if(s.next>=4)d.later(450,()=>d.finish());}
  else{s.wrong++;d.t+=1.5;d.shake();Sfx.nope();d.pop(o.el,'Henüz sırası değil! −1.5 sn',false);}
}

      else if(c>=C-2&&r<=1&&Math.random()<.7)t='sand';
      cell[r].push(t);}}
    st.innerHTML='<div class="tr"><div class="tr-map" id="trM"></div><div class="tr-side"><b>SONDAJ HAKKI</b><div class="tr-p" id="trP"></div><div class="tr-leg"></div><button class="btn primary" id="trB" disabled>İNŞA ET</button><p id="trN">Bir kare seç, sondaj yap.</p></div></div>';
    const M=st.querySelector('#trM');M.style.gridTemplateColumns='repeat('+C+',1fr)';
    const s={cell,C,R,probes:8,sel:null,built:false,res:null,els:[]};d.s=s;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){const el=$e('button','tr-c'+(c>0&&Math.abs(c-(rv+Math.sin(r*1.2)*1.1))<.55?' wet':''),'<span>?</span>');el.dataset.r=r;el.dataset.c=c;M.appendChild(el);s.els.push(el);
      el.addEventListener('click',()=>trClick(d,r,c,el));}
    st.querySelector('#trB').addEventListener('click',()=>trBuild(d));
    const leg=st.querySelector('.tr-leg');leg.innerHTML=Object.keys(TR_T).map(k=>'<span><i style="background:'+TR_T[k].c+'"></i>'+TR_T[k].n+'</span>').join('');
    trP(d);
  },
  start(d){d.info('Sondaj: <b>'+d.s.probes+'</b>');},
  score(d){const s=d.s,r=s.res;
    return{ok:!!(r&&r.good),ratio:r&&r.good?drClamp(.55+(s.probes/8)*.2+(1-d.t/d.limit)*.25,.5,1):.1,lines:[r?'Seçtiğin zemin: '+r.n+'.':'Süre doldu: arsa seçilemedi.',r?r.why:'Zemin etüdü olmadan yapıya başlanmaz.',s.probes<8?(8-s.probes)+' sondaj yaptın: yapıdan önce zemin etüdü yapılır.':'Hiç sondaj yapmadan karar verdin: riskli!']};}
};
function trP(d){const e=document.getElementById('trP');if(e)e.innerHTML=Array.from({length:8},(_,i)=>'<i class="'+(i<d.s.probes?'on':'')+'"></i>').join('');d.info('Sondaj: <b>'+d.s.probes+'</b>');}
function trClick(d,r,c,el){
  const s=d.s;if(!d.running||d.done||s.built)return;const t=s.cell[r][c],T=TR_T[t];
  if(!el.dataset.rev){
    if(s.probes<=0){Sfx.nope();d.hint('Sondaj hakkın bitti: bildiğin karelerden birine inşa et.',true);return;}
    s.probes--;el.dataset.rev='1';el.classList.add('rev');el.style.background=T.c;el.innerHTML='<span>'+T.n+'</span>';Sfx.valve();trP(d);
    d.hint(T.n+': '+T.why,!T.good);
  }
  s.sel=el;s.els.forEach(x=>x.classList.toggle('sel',x===el));const b=document.getElementById('trB');if(b){b.disabled=false;}document.getElementById('trN').textContent=(el.dataset.rev?'Seçili: '+T.n:'Sondajsız seçim');
}
function trBuild(d){
  const s=d.s;if(!s.sel||s.built||!d.running||d.done)return;
  const r=+s.sel.dataset.r,c=+s.sel.dataset.c,t=s.cell[r][c],T=TR_T[t];s.built=true;s.res=T;
  s.sel.classList.add('rev');s.sel.style.background=T.c;s.sel.innerHTML='<span>'+T.n+'</span>';
  if(T.good){Sfx.win();d.pop(s.sel,'Sağlam zemin! Bina yükseliyor',true);d.hint('Doğru karar: '+T.why,false);}
  else{Sfx.bad();d.shake();d.pop(s.sel,'Riskli zemin!',false);d.hint('Yanlış zemin: '+T.why,true);}
  d.later(1400,()=>d.finish());
}

</script>

function spreadPeople(P){
  for(let pass=0;pass<8;pass++){let moved=false;
    const o=P.slice().sort((a,b)=>a.x-b.x);
    for(let i=1;i<o.length;i++){const gap=o[i].x-o[i-1].x;if(gap<64){const d=(64-gap)/2;o[i-1].x-=d;o[i].x+=d;moved=true;}}

  return P;
}

function seisPath(){
  /* Tek, düzgün ve simetrik sismograf izi (genişlik 1280): sakin taban, ortada P→S dalgası, iki yana sönümlenir */
  let pts=[];const y0=30;
  for(let x=0;x<=1280;x+=2){const d=Math.abs(x-640);
    const env=24*Math.exp(-Math.pow(d/135,2)),tremor=1.1*Math.sin(d*.9)+.7*Math.sin(d*.37);
    const y=y0-(env*Math.sin(d*.42+.6)*(1+.25*Math.sin(d*.09))+tremor*(.5+env/24));
    pts.push((x===0?'M':'L')+x+' '+y.toFixed(1));}
  return pts.join(' ');
}

const TASKL={window:'Pencereyi aç (havalandır)',gas:'Gaz vanasını kapat',breaker:'Elektrik panosundan şalteri indir',ext:'Yangın söndürücüyle söndür',exit:'Kapıdan çık'};

    const st=p.stranded?'Yardım bekliyor':p.rescued?'Ekip desteğiyle çıktı':p.hidden?'Güvende ✓':p.down?'Ağır yaralı · yürüyemez':p.evac&&S.mode==='after'?'Çıkıyor…':p.hits?(p.state==='shelter'?'Korunuyor (yaralı)':'Yaralı'):p.state==='shelter'?'Korunuyor ✓':p.state==='walk'?(isWild()?'Kaçıyor…':'Koşuyor…'):'Komut bekliyor';
    const cls=(i===R.sel&&act&&!p.hidden?' sel':'')+(!p.stranded&&(p.hidden||(p.state==='shelter'&&!p.hits))?' ok':'')+(p.stranded||p.hits&&!p.hidden?' bad':'');

}
